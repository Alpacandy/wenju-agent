# ==============================================================================
# 《问矩》智能助教系统 · 腾讯云 2核4G 独立端口 8888 专属 Nginx 配置文件
# 特性清单：
# 1. 独立端口 8888：物理隔离，不触碰现有项目任何已有配置与路由；
# 2. 高效加载加速：全量 Gzip 强压缩 + 30天强缓存 + 内核零拷贝 sendfile；
# 3. 第三方 API 动态反向代理：解决第三方大模型端点的跨域 (CORS) 与网络连接；
# 4. 超低内存开销：内存占用 < 15MB，防范危及服务器上的其他业务进程。
# ==============================================================================

server {
    listen 8888;
    server_name 42.194.242.124; # 若有解析域名亦可填写（如 teach.yourdomain.com）

    # 静态资产物理路径（Docker 模式下内部为 /usr/share/nginx/html）
    root /data/www/teachagent/dist;
    index index.html;

    # --------------------------------------------------------------------------
    # 1. 【性能与加载速度配置】
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip 静态文本与代码全量压缩（体积压缩 70% 以上，4.48MB 压缩后传输仅约 1.2MB）
    gzip on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/wasm
        image/svg+xml;

    # 单页应用路由兜底
    location / {
        try_files $uri $uri/ /index.html;
        # 页面主 HTML 采用协商缓存，保证代码更新后立即刷新
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 静态核心库与静态资源 30 天超长本地强缓存（二次访问命中本地强缓存，含微课视频切片）
    location ~* \.(js|css|wasm|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 2. 【第三方大模型 API 动态反向代理（跨域 CORS 与网络连接解决方案）】
    # 说明：客户端若遇到不支持跨域或自建的第三方 API，可将 BaseURL 填入：
    # http://42.194.242.124:8888/api/proxy/<目标完整接口或域名>
    # 例如：/api/proxy/https://api.deepseek.com/v1/chat/completions
    # --------------------------------------------------------------------------
    location ~* ^/api/proxy/(https?):/+([^/]+)(/?.*)$ {
        resolver 119.29.29.29 223.5.5.5 8.8.8.8 127.0.0.11 valid=300s;
        resolver_timeout 5s;

        # 提取真实的目标协议、主机与路径（精准解析，杜绝 Host/SNI 漂移或 triple-slash 错位）
        set $target_proto $1;
        set $target_host $2;
        set $target_path $3;

        # 跨域 OPTIONS 预检请求全放行
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Cache-Control, x-requested-with" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # 流式传输与零内存缓存（SSE 实时打字机效果核心设置）
        proxy_pass $target_proto://$target_host$target_path$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name $target_host;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host $target_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;

        # 关闭所有中间缓冲，保证单 token 即发即收、内存占用 < 100KB
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding off;

        # 强制下发允许跨域响应头
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
    }

    # --------------------------------------------------------------------------
    # 3. 【服务器安全防御与防刷规则】
    # --------------------------------------------------------------------------
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # 屏蔽隐藏文件与敏感路径
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 错误页面定义
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
